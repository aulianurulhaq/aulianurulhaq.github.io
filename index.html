<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Ajar Sistem Digital - Kurikulum 14 Minggu</title>
  
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- KaTeX for crisp Math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  
  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/week1.css">
</head>
<body>
  <div class="app-container">
    <!-- Overlay Mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- SIDEBAR NAVIGASI 14 MINGGU -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-microchip"></i>
        </div>
        <div class="brand-info">
          <h1>SISTEM DIGITAL</h1>
          <span class="brand-badge">Interactive Learning Hub</span>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-section-title">
          <i class="fas fa-calendar-alt"></i> Silabus Perkuliahan (14 Minggu)
        </div>
        <!-- Diisi secara dinamis oleh navigation.js dari curriculum-data.js -->
        <nav id="sidebar-weeks-nav"></nav>
      </div>

      <div class="sidebar-footer">
        <div>
          <strong>MK Sistem Digital</strong><br>
          <small>Semester Genap • 3 SKS</small>
        </div>
        <span class="badge badge-accent">v1.0</span>
      </div>
    </aside>

    <!-- MAIN APP CONTENT WRAPPER -->
    <div class="app-main">
      <!-- HEADER STICKY -->
      <header class="app-header">
        <div class="header-left">
          <button type="button" class="btn-icon mobile-menu-btn" id="btn-toggle-sidebar" aria-label="Toggle Sidebar">
            <i class="fas fa-bars"></i>
          </button>
          
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <span class="bc-course"><i class="fas fa-graduation-cap"></i> Sistem Digital</span>
            <span class="bc-sep">/</span>
            <span class="bc-week" id="breadcrumb-week">Minggu 1: Sistem Bilangan</span>
            <span class="bc-sep">/</span>
            <span class="text-cyan font-bold" id="breadcrumb-topic">Konsep & Teori Biner Sentral</span>
          </nav>
        </div>

        <div class="header-right">
          <!-- Quick Search -->
          <div class="search-wrapper">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="global-search-input" placeholder="Cari materi atau topik..." autocomplete="off">
            </div>
            <div class="search-results-dropdown hidden" id="search-results-dropdown"></div>
          </div>

          <!-- Theme Toggle -->
          <button type="button" class="btn-icon" id="btn-toggle-theme" title="Ubah Mode Gelap / Terang">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- CONTENT RENDER AREA -->
      <main class="app-content" id="main-render-area">
        <!-- Konten modul akan dimuat secara dinamis di sini -->
      </main>
    </div>
  </div>

  <!-- SCRIPT LIBRARIES & MODUL -->
  <script src="js/curriculum-data.js"></script>
  <script src="js/week1.js"></script>
  <script src="js/navigation.js"></script>
</body>
</html>
